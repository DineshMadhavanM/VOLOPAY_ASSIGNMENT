# Render Blueprint Specification for SpendNest Revenue Intelligence Inbox
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Primary Static Site Service (Zero cold-start, instant global CDN, 100% free)
  - type: static
    name: spendnest-revenue-inbox
    repo: https://github.com/DineshMadhavanM/VOLOPAY_ASSIGNMENT.git
    branch: main
    rootDir: revenue-inbox
    buildCommand: echo "Building SpendNest Revenue Intelligence Inbox for Volopay Evaluation..."
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: APP_NAME
        value: "SpendNest Revenue Intelligence Inbox"
      - key: APP_ENV
        value: production
      - key: VOLOPAY_EVALUATION_MODE
        value: "enabled"
      - key: AUTH_REQUIRED
        value: "false" # Per ASSIGNMENT.md Line 86: No external credentials or auth barrier required
